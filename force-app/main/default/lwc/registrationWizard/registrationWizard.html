<template>
    <!-- STEP 1 -->
    <template if:true={isStep1}>
        <lightning-card title="Your Registrations">

            <template if:true={hasRegistrations}>
                <lightning-datatable
                    key-field="Id"
                    data={registrations}
                    columns={columns}>
                </lightning-datatable>
            </template>

            <template if:false={hasRegistrations}>
                <p class="slds-p-around_medium">No registrations found.</p>
            </template>

            <lightning-button label="New Registration" onclick={goToStep2} class="slds-m-top_medium"></lightning-button>
        </lightning-card>
    </template>

    <!-- STEP 2 -->
    <template if:true={isStep2}>
    <lightning-card title="New Registration - Details">
        <lightning-record-edit-form
            object-api-name="Registration__c"
            onsuccess={handleSuccess}
            onsubmit={handleSubmit}
            onerror={handleError}>

            <lightning-messages></lightning-messages>

            <lightning-input-field field-name="Email__c"></lightning-input-field>
            <lightning-input-field field-name="Serial_Number__c"></lightning-input-field>
            <lightning-input-field field-name="Registration_Date__c"></lightning-input-field>
            <lightning-input-field field-name="Account__c"></lightning-input-field>
            <lightning-input-field field-name="Product__c"></lightning-input-field>

            <div class="slds-m-top_medium">
                <lightning-button variant="neutral" label="Back" onclick={goToStep1}></lightning-button>
                <lightning-button variant="brand" label="Next" type="submit" class="slds-m-left_small"></lightning-button>
            </div>
        </lightning-record-edit-form>
    </lightning-card>
</template>


    <!-- STEP 3 -->
    <template if:true={isStep3}>
        <lightning-card title="New Registration - Type">
            <lightning-radio-group
                label="Registration Type"
                options={typeOptions}
                value={registrationDraft.Registration_Type__c}
                onchange={handleTypeChange}>
            </lightning-radio-group>

            <lightning-button variant="neutral" label="Back" onclick={goToStep2} class="slds-m-top_medium"></lightning-button>
            <lightning-button variant="brand" label="Submit" onclick={submitRegistration} class="slds-m-left_small"></lightning-button>
        </lightning-card>
    </template>
</template>
